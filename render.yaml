services:
  - type: web
    name: pdf2word-api
    runtime: docker
    rootDir: backend
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: ALLOWED_ORIGINS
        value: https://pdf2word-silk.vercel.app,https://pdf2word-nonotonanads-projects.vercel.app,http://localhost:5173
      - key: RATE_LIMIT
        value: 10/hour
